name: Build and Release SIPANTAU

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Embed release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os,re; tag=os.environ["RELEASE_TAG"]; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag); open("version.py", "w").write("VERSION = " + repr(tag[1:]) + "\n")'

      - name: Test protocol, offline controls, remote commands and updater
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: |
          pip install pyinstaller

      - name: Build Executable
        run: |
          pyinstaller --onefile --noconsole --uac-admin --name SIPANTAU agent.py

      - name: Prepare default config.json
        shell: bash
        run: |
          cat << 'EOF' > config.json
          {
            "api_key": "SET_A_GENERATED_KEY_OF_AT_LEAST_32_CHARACTERS",
            "server_url": "http://[IP_ADDRESS]",
            "master_password": "",
            "verify_ssl": true,
            "screenshot_jpeg_quality": 80,
            "auto_update": false,
            "autorun": false,
            "auto_lock_on_run": false,
            "hostname": "PC-00"
          }
          EOF

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/SIPANTAU.exe
            config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
