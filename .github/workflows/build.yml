name: Build and Release SIPANTAU

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a scan-only build, for example v1.7.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      PYTHONHASHSEED: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install application and pinned build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Test protocol, offline controls, remote commands and release guards
        run: python -m unittest discover -s tests -v

      - name: Build recommended folder package
        run: python scripts/build_windows.py onedir --tag $env:RELEASE_TAG

      - name: Scan complete folder package with Microsoft Defender
        run: ./scripts/scan_release.ps1 -Path dist/onedir/SIPANTAU -ReportPath build-reports/portable-scan.json

      - name: Create portable ZIP
        run: python scripts/build_windows.py archive --tag $env:RELEASE_TAG

      - name: Scan the final portable ZIP
        run: ./scripts/scan_release.ps1 -Path release/SIPANTAU-portable.zip -ReportPath build-reports/portable-archive-scan.json

      - name: Build optional legacy executable
        id: legacy-build
        continue-on-error: true
        run: python scripts/build_windows.py onefile --tag $env:RELEASE_TAG

      - name: Scan optional legacy executable
        id: legacy-scan
        if: steps.legacy-build.outcome == 'success'
        continue-on-error: true
        run: ./scripts/scan_release.ps1 -Path dist/onefile/SIPANTAU.exe -ReportPath build-reports/legacy-scan.json

      - name: Include legacy executable only after a successful scan
        if: steps.legacy-scan.outcome == 'success'
        run: Copy-Item -LiteralPath dist/onefile/SIPANTAU.exe -Destination release/SIPANTAU.exe

      - name: Collect scan reports and release provenance
        run: |
          Copy-Item build-reports/*.json release/
          python scripts/build_windows.py manifest --tag $env:RELEASE_TAG
          if ('${{ steps.legacy-scan.outcome }}' -ne 'success') {
            Write-Warning 'The legacy executable was not approved for publication. This release contains only the complete folder package.'
          }

      - name: Show scan reports even when a gate fails
        if: always()
        run: |
          Get-ChildItem build-reports/*.json -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host $_.Name
            Get-Content -LiteralPath $_.FullName | Write-Host
          }

      - name: Preserve scan reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-scan-reports
          path: build-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save scanned candidate packages for a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: scanned-release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release from scanned artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Recommended download: SIPANTAU-portable.zip. Extract the complete folder and keep _internal beside SIPANTAU.exe. Configure your private config.json before starting.

            Folder packages use manual installation for updates. When upgrading, retain your existing config.json and state.json; do not overwrite them with the template.

            SIPANTAU.exe is included only if the optional legacy single-file build passed its Defender scan. SHA256SUMS.txt, build-manifest.json and scan reports describe the published artifacts. A clean CI scan is a point-in-time result, not a guarantee against future or other-engine detections.
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
